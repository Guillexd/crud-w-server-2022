<header class="sticky top-0 z-20 border-b border-slate-700/60 bg-slate-900 text-white shadow-lg">
  <div class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between px-4 sm:px-6">
    <a routerLink="/personas" class="flex items-center gap-3">
      <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-sky-400 to-blue-600 text-white shadow">
        <mat-icon>people</mat-icon>
      </span>
      <span class="text-lg font-semibold tracking-tight">Gestión de Personas</span>
    </a>

    <nav class="flex items-center gap-1">
      <a
        routerLink="/personas"
        routerLinkActive="bg-slate-700 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white"
      >
        <mat-icon class="text-xl">list</mat-icon>
        Lista
      </a>
      <a
        routerLink="/personas/nuevo"
        routerLinkActive="bg-slate-700 text-white"
        class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-700 hover:text-white"
      >
        <mat-icon class="text-xl">add_circle</mat-icon>
        Nueva persona
      </a>
    </nav>
  </div>
</header>

<main class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6">
  <router-outlet />
</main>
